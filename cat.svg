<script type="application/ecmascript"><![CDATA[
(function () {
  var svg = document.documentElement;
  var leftPupil = document.getElementById('leftPupil');
  var rightPupil = document.getElementById('rightPupil');
  // Eye centers in SVG coordinates.
  var eyes = [
    { el: leftPupil,  cx: 436.918, cy: 446.501 },
    { el: rightPupil, cx: 699.275, cy: 446.501 }
  ];
  // Cat pupils are vertical slits — allow more horizontal travel than vertical.
  var MAX_X = 11;
  var MAX_Y = 4;
  var SATURATE = 420;

  function clientToSvg(x, y) {
    var pt = svg.createSVGPoint();
    pt.x = x; pt.y = y;
    var ctm = svg.getScreenCTM();
    if (!ctm) return null;
    return pt.matrixTransform(ctm.inverse());
  }

  function update(clientX, clientY) {
    var p = clientToSvg(clientX, clientY);
    if (!p) return;
    for (var i = 0; i < eyes.length; i++) {
      var eye = eyes[i];
      var dx = p.x - eye.cx;
      var dy = p.y - eye.cy;
      var dist = Math.sqrt(dx * dx + dy * dy);
      var k = Math.min(1, dist / SATURATE);
      var ang = Math.atan2(dy, dx);
      var ox = Math.cos(ang) * MAX_X * k;
      var oy = Math.sin(ang) * MAX_Y * k;
      eye.el.setAttribute('transform', 'translate(' + ox.toFixed(2) + ' ' + oy.toFixed(2) + ')');
    }
  }

  window.addEventListener('mousemove', function (e) { update(e.clientX, e.clientY); });
  window.addEventListener('touchmove', function (e) {
    if (e.touches && e.touches[0]) update(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  // ---- Periodic blink ----
  var eyeGroups = svg.querySelectorAll('.eye');
  function closeEyes()  { for (var i = 0; i < eyeGroups.length; i++) eyeGroups[i].classList.add('blink'); }
  function openEyes()   { for (var i = 0; i < eyeGroups.length; i++) eyeGroups[i].classList.remove('blink'); }

  function blinkOnce(done) {
    closeEyes();
    setTimeout(function () { openEyes(); if (done) done(); }, 110);
  }

  function scheduleNext() {
    // Natural-feeling: 2.5–7s between blink events.
    var delay = 2500 + Math.random() * 4500;
    setTimeout(function () {
      blinkOnce(function () {
        // ~15% chance of a quick double-blink.
        if (Math.random() < 0.15) {
          setTimeout(function () { blinkOnce(scheduleNext); }, 140);
        } else {
          scheduleNext();
        }
      });
    }, delay);
  }
  scheduleNext();
})();
]]></script>
