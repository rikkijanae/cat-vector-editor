<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cat — pupils that follow your cursor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; }
  body { display: grid; place-items: center; overflow: hidden; }
  /* The SVG scales to fit the viewport while keeping its aspect ratio. */
  object { width: 100vmin * (1600 / 1200); height: 100vmin; max-width: 100vw; max-height: 100vh; }
  object { width: min(100vw, calc(100vh * 4 / 3)); height: min(100vh, calc(100vw * 3 / 4)); display: block; }
</style>
</head>
<body>
  <object type="image/svg+xml" data="cat.svg" aria-label="Cat illustration whose pupils follow the cursor"></object>
  <script>
    // The SVG handles cursor tracking internally via its own mousemove listener.
    // When the SVG is loaded inside <object>, the inner document only receives
    // mouse events while the cursor is over it. Forward outer-window events
    // into the inner SVG so the pupils track from anywhere on the page.
    const obj = document.querySelector('object');
    obj.addEventListener('load', () => {
      const inner = obj.contentDocument;
      if (!inner) return;
      const innerSvg = inner.documentElement;
      function forward(e) {
        const rect = obj.getBoundingClientRect();
        const pt = innerSvg.createSVGPoint();
        pt.x = e.clientX - rect.left;
        pt.y = e.clientY - rect.top;
        // Dispatch a synthetic mousemove inside the SVG document at the same client coords.
        const evt = new inner.defaultView.MouseEvent('mousemove', {
          clientX: pt.x + rect.left, clientY: pt.y + rect.top, bubbles: true
        });
        innerSvg.dispatchEvent(evt);
      }
      window.addEventListener('mousemove', forward);
    });
  </script>
</body>
</html>
