<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cat — pupils that follow your cursor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; }
  body { display: grid; place-items: center; overflow: hidden; }
  object {
    width: min(100vw, calc(100vh * 4 / 3));
    height: min(100vh, calc(100vw * 3 / 4));
    display: block;
  }
</style>
</head>
<body>
  <object type="image/svg+xml" data="cat.svg" aria-label="Cat illustration whose pupils follow the cursor"></object>
  <script>
    // Forward window-level mousemove into the inner SVG so the pupils track
    // the cursor anywhere on the page, not just over the SVG itself.
    const obj = document.querySelector('object');
    obj.addEventListener('load', () => {
      const inner = obj.contentDocument;
      if (!inner) return;
      const innerSvg = inner.documentElement;
      window.addEventListener('mousemove', (e) => {
        const evt = new inner.defaultView.MouseEvent('mousemove', {
          clientX: e.clientX, clientY: e.clientY, bubbles: true
        });
        innerSvg.dispatchEvent(evt);
      });
    });
  </script>
</body>
</html>
